<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置 · 灵搭 LingDa</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="side-profile" href="me.html" title="个人主页">
          <div class="avatar av-indigo" data-user="me">开</div>
          <div class="side-profile-info">
            <div class="side-profile-name">开发预览</div>
            <div class="side-profile-meta">新闻学院 · 研一</div>
            <div class="side-profile-tags">
              <span class="tag tag-sky">认证学生</span>
            </div>
          </div>
          <span class="side-profile-chev">›</span>
        </a>
        <a class="brand" href="announcements.html">
          <div class="brand-mark">灵</div>
          <div class="brand-text">
            <span class="brand-name">灵搭</span>
            <span class="brand-sub">LingDa</span>
          </div>
        </a>
      </div>
      <nav class="nav">
        <a class="nav-item" data-page="announcements.html" href="announcements.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>公告</span>
        </a>
        <a class="nav-item" data-page="forum.html" href="forum.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>贴吧</span>
        </a>
        <a class="nav-item" data-page="partners.html" href="partners.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>搭子</span>
        </a>
        <a class="nav-item" data-page="favorites.html" href="favorites.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>收藏</span>
        </a>
        <a class="nav-item" data-page="settings.html" href="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span>设置</span>
        </a>
      </nav>
      <div class="sidebar-foot">校园协作匹配平台</div>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h1 class="page-title">系统设置</h1>
          <p class="page-desc">认证、隐私与安全</p>
        </div>
      </div>

      <div class="stack">
        <section class="banner">
          <div>
            <h3>完成校内认证，解锁更多功能</h3>
            <p>认证后可发布官方公告、获得「认证学生」标识</p>
          </div>
          <a class="btn" href="#">去认证</a>
        </section>

        <section class="card">
          <div class="card-head"><h2 class="card-title">身份认证</h2></div>
          <a class="link-row" href="#" style="margin-bottom:10px">
            <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/></svg></div>
            <div class="grow">
              <div class="title">学生认证</div>
              <div class="sub">上传学生证 · 审核约 1 个工作日</div>
            </div>
            <span class="tag tag-sky">未认证</span>
          </a>
          <a class="link-row" href="#" style="margin-bottom:10px">
            <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
            <div class="grow">
              <div class="title">社团认证</div>
              <div class="sub">社团负责人申请官方标识</div>
            </div>
            <span class="chev">›</span>
          </a>
          <a class="link-row" href="#">
            <div class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg></div>
            <div class="grow">
              <div class="title">官方机构认证</div>
              <div class="sub">院系 / 行政部门</div>
            </div>
            <span class="chev">›</span>
          </a>
        </section>

        <section class="card">
          <div class="card-head"><h2 class="card-title">隐私</h2></div>
          <div class="setting-row">
            <div>
              <div class="label">允许被学号搜索</div>
              <div class="hint">关闭后他人无法通过学号找到你</div>
            </div>
            <button type="button" class="toggle on" aria-pressed="true" aria-label="允许被学号搜索"></button>
          </div>
          <div class="setting-row">
            <div>
              <div class="label">展示个人主页预览</div>
              <div class="hint">在搭子推荐卡片中显示简介</div>
            </div>
            <button type="button" class="toggle on" aria-pressed="true" aria-label="展示个人主页预览"></button>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2 class="card-title">安全</h2></div>
          <div class="setting-row">
            <div>
              <div class="label">新消息通知</div>
              <div class="hint">私信与组队邀请推送</div>
            </div>
            <button type="button" class="toggle on" aria-pressed="true" aria-label="新消息通知"></button>
          </div>
          <div class="setting-row">
            <div>
              <div class="label">修改密码</div>
              <div class="hint">定期更换密码保障账号安全</div>
            </div>
            <a class="btn btn-ghost btn-sm" href="#">修改</a>
          </div>
          <div class="setting-row">
            <div>
              <div class="label">退出登录</div>
              <div class="hint">返回登录页</div>
            </div>
            <a class="btn btn-ghost btn-sm" href="login.html">退出</a>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="js/users.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/avatar.js"></script>
</body>
</html>
