<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>收藏 · 灵搭 LingDa</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="side-profile" href="me.html" title="个人主页">
          <div class="avatar av-indigo" data-user="me">开</div>
          <div class="side-profile-info">
            <div class="side-profile-name">开发预览</div>
            <div class="side-profile-meta">新闻学院 · 研一</div>
            <div class="side-profile-tags">
              <span class="tag tag-sky">认证学生</span>
            </div>
          </div>
          <span class="side-profile-chev">›</span>
        </a>
        <a class="brand" href="announcements.html">
          <div class="brand-mark">灵</div>
          <div class="brand-text">
            <span class="brand-name">灵搭</span>
            <span class="brand-sub">LingDa</span>
          </div>
        </a>
      </div>
      <nav class="nav">
        <a class="nav-item" data-page="announcements.html" href="announcements.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>公告</span>
        </a>
        <a class="nav-item" data-page="forum.html" href="forum.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>贴吧</span>
        </a>
        <a class="nav-item" data-page="partners.html" href="partners.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>搭子</span>
        </a>
        <a class="nav-item" data-page="favorites.html" href="favorites.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <span>收藏</span>
        </a>
        <a class="nav-item" data-page="settings.html" href="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span>设置</span>
        </a>
      </nav>
      <div class="sidebar-foot">校园协作匹配平台</div>
    </aside>

    <main class="main">
      <div class="page-head">
        <div>
          <h1 class="page-title">我的收藏</h1>
          <p class="page-desc">收藏的帖子与搭子</p>
        </div>
      </div>

      <div class="pills" style="margin-bottom:16px">
        <button type="button" class="pill active" data-filter>全部</button>
        <button type="button" class="pill" data-filter>帖子</button>
        <button type="button" class="pill" data-filter>搭子</button>
      </div>

      <div class="stack">
        <article class="card post-card">
          <div class="avatar av-sky" data-user="lin" title="查看主页">林</div>
          <div class="post-body">
            <div class="post-user">
              <span class="name">小林</span>
              <span class="tag tag-sky">帖子</span>
              <span class="time">收藏于 2 天前</span>
            </div>
            <h3 class="post-title">有一起刷高数习题的吗？</h3>
            <p class="post-snippet">想找 1–2 个同班同学晚上去二教自习，进度第四章。</p>
          </div>
        </article>

        <article class="card">
          <div class="row" style="align-items:flex-start">
            <div class="avatar av-teal" data-user="cheng" title="查看主页">程</div>
            <div style="flex:1;min-width:0">
              <div class="row" style="justify-content:space-between;flex-wrap:wrap">
                <div class="row">
                  <strong style="font-size:14px">程思</strong>
                  <span class="tag tag-teal">搭子</span>
                </div>
                <span style="font-size:12px;color:var(--muted-soft)">收藏于 1 周前</span>
              </div>
              <p style="margin-top:6px;font-size:13px;color:var(--muted)">算法 / 考研数学 · ★ 5.0 · 组队 15 次</p>
              <div style="margin-top:10px">
                <a class="btn btn-soft btn-sm" href="partners.html">查看主页</a>
              </div>
            </div>
          </div>
        </article>

        <article class="card post-card">
          <div class="avatar av-amber" data-user="photo" title="查看主页">社</div>
          <div class="post-body">
            <div class="post-user">
              <span class="name">摄影协会</span>
              <span class="tag tag-sky">帖子</span>
              <span class="time">收藏于 2 周前</span>
            </div>
            <h3 class="post-title">周末夜景外拍报名中</h3>
            <p class="post-snippet">本周六晚集合图书馆门口，路线校园湖—主楼灯饰。</p>
          </div>
        </article>
      </div>
    </main>
  </div>
  <script src="js/users.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/avatar.js"></script>

</html>
