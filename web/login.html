<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 灵搭 LingDa</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">
      <aside class="auth-panel">
        <div>
          <div class="brand">
            <div class="brand-mark">灵</div>
            <div class="brand-text">
              <span class="brand-name">灵搭</span>
              <span class="brand-sub">LingDa</span>
            </div>
          </div>
          <div style="margin-top:20px">
            <span class="tag tag-indigo">校园协作匹配平台</span>
          </div>
          <h1>找到同频的<br /><em>校园搭子</em></h1>
          <p class="lead">拼车出行、娱乐开黑、学习组队 — 一站式匹配与聊天，开局即协作。</p>
          <div class="pills" style="margin-top:20px">
            <span class="tag tag-sky">拼车</span>
            <span class="tag tag-amber">娱乐</span>
            <span class="tag tag-teal">学习</span>
          </div>
        </div>
        <div class="auth-stats">
          <div class="auth-stat"><strong>12k+</strong><span>校园用户</span></div>
          <div class="auth-stat"><strong>3.8k</strong><span>成功组队</span></div>
          <div class="auth-stat"><strong>4.9★</strong><span>平均口碑</span></div>
        </div>
      </aside>

      <main class="auth-form">
        <div class="eyebrow">Sign In</div>
        <h2>欢迎回来</h2>
        <p class="sub">使用学号登录你的校园协作空间</p>

        <form class="stack" action="#" method="get" onsubmit="return false;">
          <div class="field">
            <label>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6"/></svg>
              学号
            </label>
            <input class="input" type="text" name="userId" placeholder="请输入学号" autocomplete="username" />
          </div>
          <div class="field">
            <label>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              密码
            </label>
            <input class="input" type="password" name="password" placeholder="至少 6 位" autocomplete="current-password" />
          </div>

          <div class="auth-row-between">
            <label class="check">
              <input type="checkbox" name="remember" />
              记住我
            </label>
            <a href="#">忘记密码？</a>
          </div>

          <div class="auth-actions">
            <button type="submit" class="btn btn-primary btn-block">立即登录</button>
            <a class="btn btn-soft btn-block" href="announcements.html">开发预览 · 直接进入</a>
          </div>
        </form>

        <p class="auth-foot">
          还没账号？<a href="register.html">立即注册</a>
        </p>
      </main>
    </div>
  </div>
</body>
</html>
