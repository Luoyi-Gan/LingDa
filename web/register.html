<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>注册 · 灵搭 LingDa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="auth">
    <aside class="auth-brand t-sky">
      <svg class="auth-decor" viewBox="0 0 200 200" fill="none" aria-hidden="true">
        <circle cx="100" cy="100" r="92" stroke="currentColor" stroke-width="1" />
        <circle cx="100" cy="100" r="70" stroke="currentColor" stroke-width="1" />
        <circle cx="100" cy="100" r="48" stroke="currentColor" stroke-width="1" />
        <line x1="0" y1="100" x2="200" y2="100" stroke="currentColor" stroke-width="1" />
        <line x1="100" y1="0" x2="100" y2="200" stroke="currentColor" stroke-width="1" />
      </svg>

      <a class="auth-badge" href="login.html">← 返回登录</a>

      <div>
        <div class="auth-logo">
          <div class="auth-logo-mark">灵</div>
          <div>
            <div class="font-heading" style="font-size:20px;font-weight:800">灵搭</div>
            <div style="font-size:10px;letter-spacing:0.18em;text-transform:uppercase;opacity:0.7;margin-top:6px">LingDa</div>
          </div>
        </div>
        <h1>创建你的<br />校园身份</h1>
        <p class="lead">完成几个简单字段，立刻开始找搭子。我们仅在内部使用真实姓名做审核。</p>
        <div class="stack" style="margin-top:32px;display:none" id="reg-checks">
          <div class="row"><span class="chip chip-indigo">✓</span> 学号绑定，0 重复账号</div>
          <div class="row"><span class="chip chip-indigo">✓</span> 真实姓名仅内部审核</div>
          <div class="row"><span class="chip chip-indigo">✓</span> 即刻使用三大模块</div>
        </div>
        <style>@media(min-width:960px){#reg-checks{display:flex!important}}</style>
      </div>
      <div class="auth-copy">© 2026 灵搭 LingDa</div>
    </aside>

    <main class="auth-form" style="align-items:flex-start">
      <div class="auth-form-inner wide" style="padding-top:16px">
        <div class="eyebrow">Create Account</div>
        <h2>创建账号</h2>
        <p class="sub">填写以下信息开始使用搭子</p>

        <div class="grid-2">
          <div class="field"><label>学号 <span class="text-cta">*</span></label><input class="input" id="reg-student" placeholder="4-50 位" /></div>
          <div class="field"><label>昵称 <span class="text-cta">*</span></label><input class="input" id="reg-name" placeholder="展示给搭子" /></div>
          <div class="field"><label>真实姓名 <span class="text-cta">*</span></label><input class="input" id="reg-realname" placeholder="内部审核用" /></div>
          <div class="field"><label>密码 <span class="text-cta">*</span></label><input class="input" id="reg-password" type="password" placeholder="至少 6 位" /></div>
          <div class="field"><label>手机号 <span class="text-cta">*</span></label><input class="input" id="reg-phone" placeholder="11 位手机号" /></div>
          <div class="field"><label>学院 <span class="text-cta">*</span></label><input class="input" id="reg-college" placeholder="如：新闻学院" /></div>
          <div class="field"><label>专业</label><input class="input" id="reg-major" placeholder="选填" /></div>
          <div class="field"><label>性别</label><input class="input" id="reg-gender" placeholder="男 / 女 / 不填" /></div>
        </div>

        <button type="button" class="btn btn-cta btn-block" id="register-submit" style="margin-top:24px">完成注册</button>
        <p class="auth-foot">已有账号？<a href="login.html">返回登录</a></p>
      </div>
    </main>
  </div>
  <script src="js/ui.js"></script>
  <script src="js/users.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
