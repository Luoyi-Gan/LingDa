# 灵搭 LingDa —— Mac mini 上的 Nginx 站点配置
# 装入：/opt/homebrew/etc/nginx/servers/lingda.conf
# 然后 brew services restart nginx

server {
    listen      80 default_server;
    server_name _;

    root        /opt/lingda/web;
    index       index.html;

    server_tokens off;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml+rss;
    gzip_vary on;
    gzip_min_length 1024;

    # 后端 /api 反代到本机 NestJS
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 静态资源长缓存
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
