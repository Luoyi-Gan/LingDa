# 灵搭学校服务器 Nginx 模板
# 替换域名和证书路径后放入 /etc/nginx/sites-available/lingda

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name lingda.example.edu.cn lingda-admin.example.edu.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lingda.example.edu.cn;
    ssl_certificate /etc/ssl/lingda/fullchain.pem;
    ssl_certificate_key /etc/ssl/lingda/privkey.pem;
    root /opt/lingda/current/student;
    index index.html;
    include /etc/nginx/snippets/lingda-security.conf;
    include /etc/nginx/snippets/lingda-api.conf;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl http2;
    server_name lingda-admin.example.edu.cn;
    ssl_certificate /etc/ssl/lingda/fullchain.pem;
    ssl_certificate_key /etc/ssl/lingda/privkey.pem;
    root /opt/lingda/current/admin;
    index index.html;
    include /etc/nginx/snippets/lingda-security.conf;
    include /etc/nginx/snippets/lingda-api.conf;
    location / { try_files $uri $uri/ /index.html; }
}

