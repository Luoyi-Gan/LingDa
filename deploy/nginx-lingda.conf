# 灵搭 LingDa —— Nginx 站点配置
# 模式：单端口同源（前端 SPA + /api 反代到后端 3000）
# 装入：/etc/nginx/sites-available/lingda  →  ln -s 到 sites-enabled/

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root        /var/www/lingda;
    index       index.html;

    # 安全 / 性能小杂项
    server_tokens off;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # 后端 /api 反代
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源长缓存（hash 命名的 js / css / 字体）
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback —— 所有其他路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
